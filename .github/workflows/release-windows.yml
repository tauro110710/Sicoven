name: SICOVEN Windows Release

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/release-windows.yml'
      - 'scripts/e2e-migration-ui.cjs'
      - 'electron/main.cjs'
      - 'electron/preload.cjs'
      - 'electron/auth-setup-policy.cjs'
      - 'src/App.tsx'
      - 'src/components/LoginScreen.tsx'
      - 'scripts/test-auth-hardening.cjs'
      - 'electron/supporting-documents.cjs'
      - 'electron/supporting-documents.test.cjs'
      - 'electron/backup-restore.cjs'
      - 'electron/backup-restore.test.cjs'
      - 'electron/restore-engine.cjs'
      - 'electron/restore-staging.cjs'
      - 'electron/tenant-document-migration.cjs'
      - 'electron/tenant-document-migration.test.cjs'
      - 'electron/tenant-migration-orchestrator.cjs'
      - 'electron/tenant-migration-orchestrator.test.cjs'
    tags:
      - 'v*'
  pull_request:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/release-windows.yml'
      - 'scripts/e2e-migration-ui.cjs'
      - 'electron/main.cjs'
      - 'electron/preload.cjs'
      - 'electron/auth-setup-policy.cjs'
      - 'src/App.tsx'
      - 'src/components/LoginScreen.tsx'
      - 'scripts/test-auth-hardening.cjs'
      - 'electron/supporting-documents.cjs'
      - 'electron/supporting-documents.test.cjs'
      - 'electron/backup-restore.cjs'
      - 'electron/backup-restore.test.cjs'
      - 'electron/restore-engine.cjs'
      - 'electron/restore-staging.cjs'
      - 'electron/tenant-document-migration.cjs'
      - 'electron/tenant-document-migration.test.cjs'
      - 'electron/tenant-migration-orchestrator.cjs'
      - 'electron/tenant-migration-orchestrator.test.cjs'
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publicar la versión en el repositorio de descargas (solo después de validar)'
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  contents: write

# Release restoration uses the repository token for artifact reads and the release token for external asset writes.

concurrency:
  group: sicoven-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Restore Windows application icon
        shell: pwsh
        run: |
          $iconPath = Join-Path $env:GITHUB_WORKSPACE 'build/sicoven.ico'
          if (Test-Path 'build/sicoven.ico.base64') {
            $iconBase64 = (Get-Content -Raw 'build/sicoven.ico.base64').Trim()
            if ($iconBase64.Length -gt 100 -and $iconBase64 -ne 'BASE64_PLACEHOLDER') {
              [IO.File]::WriteAllBytes($iconPath, [Convert]::FromBase64String($iconBase64))
            }
          }
          if (-not (Test-Path $iconPath) -or (Get-Item $iconPath).Length -lt 100) {
            throw 'El icono de SICOVEN no se generó correctamente.'
          }
          Copy-Item $iconPath (Join-Path $env:GITHUB_WORKSPACE 'build/icon.ico') -Force

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python for SQLite upgrade verification
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Test authentication and session security guards
        run: node scripts/test-auth-hardening.cjs

      - name: Test accounting and credit settlement calculations
        run: npm test

      - name: Type-check the application
        run: npm run check:types

      - name: Audit local resources before production build
        run: npm run audit:assets -- --source-only

      - name: Build full edition without sample data
        run: npm run build

      - name: Audit production assets and verify no mock data leaks
        run: npm run audit:assets

      - name: Verify full bundle excludes demo sample records
        shell: pwsh
        run: |
          $bundles = Get-ChildItem -Path dist/assets -Filter '*.js' -File
          if (-not $bundles) {
            throw 'No se generaron bundles JavaScript para SICOVEN completo.'
          }
          if (Select-String -Path $bundles.FullName -SimpleMatch -Pattern 'administracion@losandesdist.com.ve' -Quiet) {
            throw 'El bundle completo contiene datos de ejemplo; no se publicará este instalador.'
          }

      - name: Package installer for PR validation without publishing
        if: github.event_name == 'pull_request'
        run: npx electron-builder --win nsis --publish never

      - name: Package updater metadata and installer locally
        if: startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && github.event_name == 'push') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
        run: npx electron-builder --win nsis --publish never

      - name: Verify installer and updater metadata
        if: startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && github.event_name == 'push') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || github.event_name == 'pull_request'
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path release -Filter 'SICOVEN-Setup-*-x64.exe' -File | Select-Object -First 1
          if (-not $installer) {
            throw 'No se generó el instalador completo .exe de SICOVEN.'
          }
          if ($env:GITHUB_EVENT_NAME -ne 'pull_request') {
            $metadata = Join-Path $env:GITHUB_WORKSPACE 'release/latest.yml'
            if (-not (Test-Path $metadata -PathType Leaf)) {
              throw 'No se generó latest.yml; se cancela la publicación para evitar una actualización incompleta.'
            }
            $metadataText = Get-Content -Raw $metadata
            $expectedVersion = node -p "require('./package.json').version"
            if ($metadataText -notmatch "(?m)^version:\s*$([regex]::Escape($expectedVersion))\s*$") {
              throw "latest.yml no corresponde a la versión $expectedVersion esperada."
            }
            if ($metadataText -notmatch '(?m)^sha512:\s*\S+') {
              throw 'latest.yml no contiene el SHA-512 del instalador.'
            }
          }
          Get-FileHash $installer.FullName -Algorithm SHA256 | Format-List

      - name: Install and launch smoke test
        if: startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && github.event_name == 'push') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || github.event_name == 'pull_request'
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path release -Filter 'SICOVEN-Setup-*-x64.exe' -File | Select-Object -First 1
          if (-not $installer) {
            throw 'No se encontró el instalador completo para la prueba de instalación.'
          }
          $installDir = Join-Path $env:RUNNER_TEMP 'SICOVEN-Release-Smoke'
          if (Test-Path $installDir) {
            Remove-Item -Path $installDir -Recurse -Force
          }
          $install = Start-Process -FilePath $installer.FullName -ArgumentList @('/S', "/D=$installDir") -PassThru
          if (-not $install.WaitForExit(120000)) {
            $autoApplication = Get-Process -Name 'SICOVEN' -ErrorAction SilentlyContinue
            if ($autoApplication) {
              & taskkill.exe /IM SICOVEN.exe /T /F | Out-Null
            }
            if (-not $install.WaitForExit(30000)) {
              throw 'El instalador NSIS no terminó dentro del tiempo permitido.'
            }
          }
          $install.Refresh()
          if ($install.ExitCode -ne 0) {
            throw "El instalador NSIS terminó con código $($install.ExitCode)."
          }
          $app = Join-Path $installDir 'SICOVEN.exe'
          $asar = Join-Path $installDir 'resources\app.asar'
          $sqliteNative = Join-Path $installDir 'resources\app.asar.unpacked\node_modules\better-sqlite3\build\Release\better_sqlite3.node'
          foreach ($required in @($app, $asar, $sqliteNative)) {
            if (-not (Test-Path $required -PathType Leaf)) {
              throw "Falta un archivo esencial después de instalar: $required"
            }
          }
          $autoApplication = Get-Process -Name 'SICOVEN' -ErrorAction SilentlyContinue
          if ($autoApplication) {
            & taskkill.exe /IM SICOVEN.exe /T /F | Out-Null
            Start-Sleep -Seconds 2
          }
          $application = Start-Process -FilePath $app -ArgumentList @('--disable-gpu') -PassThru
          Start-Sleep -Seconds 12
          $application.Refresh()
          if ($application.HasExited) {
            throw "SICOVEN se cerró durante el arranque de prueba. Código: $($application.ExitCode)"
          }
          $database = Get-ChildItem -Path $env:APPDATA -Filter 'sicoven.sqlite' -Recurse -File -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $database) {
            throw 'SICOVEN no creó su base de datos SQLite local durante el primer arranque.'
          }
          & taskkill.exe /PID $application.Id /T /F | Out-Null
          Write-Host 'Instalación, app.asar, módulo SQLite nativo, creación de sicoven.sqlite y arranque verificados.'
          Get-Item $installer.FullName | Select-Object Name, Length

      - name: End-to-end universal migration UI and SQLite verification
        shell: pwsh
        run: |
          $env:SICOVEN_E2E_APP = Join-Path $env:RUNNER_TEMP 'SICOVEN-Release-Smoke\SICOVEN.exe'
          node scripts/e2e-migration-ui.cjs
          if ($LASTEXITCODE -ne 0) {
            & taskkill.exe /IM SICOVEN.exe /T /F 2>$null | Out-Null
            throw 'La prueba E2E de migración visual y persistencia SQLite falló.'
          }

      - name: Upload migration E2E screenshots
        if: always() && github.event_name != 'pull_request'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: SICOVEN-migration-E2E-screenshots
          path: artifacts/migration-*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Verify upgrade from v1.0.17 preserves SQLite user data
        if: startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && github.event_name == 'push') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || github.event_name == 'pull_request'
        shell: pwsh
        run: |
          # Electron resuelve app.getPath('userData') mediante las carpetas conocidas de Windows;
          # cambiar APPDATA en este proceso PowerShell no garantiza que el proceso Electron lo herede.
          # El runner es efímero: limpiamos únicamente los archivos SQLite de la app creados por
          # el smoke test anterior y dejamos que v1.0.17 cree su base en la ruta real predeterminada.
          # El smoke test anterior puede dejar un proceso hijo de Electron con SQLite abierto.
          # Cierra todos los procesos SICOVEN del runner y comprueba el bloqueo antes de limpiar
          # exclusivamente la base de datos de esta aplicación.
          & taskkill.exe /IM SICOVEN.exe /T /F 2>$null | Out-Null
          $databaseDirectory = Join-Path $env:APPDATA 'sicoven-desktop'
          $databasePath = Join-Path $databaseDirectory 'sicoven.sqlite'
          if (Test-Path $databasePath -PathType Leaf) {
            $databaseUnlocked = $false
            for ($attempt = 0; $attempt -lt 15; $attempt++) {
              try {
                $probe = [System.IO.File]::Open($databasePath, [System.IO.FileMode]::Open, [System.IO.FileAccess]::ReadWrite, [System.IO.FileShare]::None)
                $probe.Dispose()
                $databaseUnlocked = $true
                break
              } catch {
                Start-Sleep -Seconds 1
              }
            }
            if (-not $databaseUnlocked) {
              throw "La base SQLite sigue bloqueada después de cerrar SICOVEN: $databasePath"
            }
            Remove-Item -LiteralPath $databasePath -Force
            Remove-Item -LiteralPath ($databasePath + '-wal') -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath ($databasePath + '-shm') -Force -ErrorAction SilentlyContinue
          }
          $env:SICOVEN_UPGRADE_MARKER = 'SICOVEN-UPGRADE-PRESERVATION-' + [guid]::NewGuid().ToString('N')

          $installDir = Join-Path $env:RUNNER_TEMP 'SICOVEN-Upgrade-Install'
          $oldInstaller = Join-Path $env:RUNNER_TEMP 'SICOVEN-Setup-1.0.17-x64.exe'
          $oldUrl = 'https://github.com/fenixlife1978/sicoven-descargas/releases/download/v1.0.17/SICOVEN-Setup-1.0.17-x64.exe'
          Invoke-WebRequest -Uri $oldUrl -OutFile $oldInstaller
          if (-not (Test-Path $oldInstaller -PathType Leaf) -or (Get-Item $oldInstaller).Length -lt 1000000) {
            throw 'No se pudo descargar el instalador anterior v1.0.17.'
          }
          if (Test-Path $installDir) { Remove-Item -Path $installDir -Recurse -Force }
          $oldInstall = Start-Process -FilePath $oldInstaller -ArgumentList @('/S', "/D=$installDir") -PassThru
          if (-not $oldInstall.WaitForExit(180000)) { throw 'La instalación de SICOVEN v1.0.17 excedió el tiempo permitido.' }
          $oldInstall.Refresh()
          if ($oldInstall.ExitCode -ne 0) { throw "El instalador v1.0.17 terminó con código $($oldInstall.ExitCode)." }

          $app = Join-Path $installDir 'SICOVEN.exe'
          if (-not (Test-Path $app -PathType Leaf)) { throw 'No se encontró SICOVEN.exe después de instalar v1.0.17.' }
          $oldApp = Start-Process -FilePath $app -ArgumentList @('--disable-gpu') -PassThru
          Start-Sleep -Seconds 12
          $oldApp.Refresh()
          if ($oldApp.HasExited) { throw "SICOVEN v1.0.17 no arrancó. Código: $($oldApp.ExitCode)" }
          $null = $oldApp.CloseMainWindow()
          if (-not $oldApp.WaitForExit(15000)) { & taskkill.exe /PID $oldApp.Id /T /F | Out-Null }
          & taskkill.exe /IM SICOVEN.exe /T /F 2>$null | Out-Null
          Start-Sleep -Seconds 2

          $database = Get-ChildItem -Path $env:APPDATA -Filter 'sicoven.sqlite' -Recurse -File -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $database) { throw 'SICOVEN v1.0.17 no creó sicoven.sqlite en el perfil aislado; no se puede verificar la actualización.' }
          $env:SICOVEN_UPGRADE_DB = $database.FullName
          python -c "import os,sqlite3; db=sqlite3.connect(os.environ['SICOVEN_UPGRADE_DB']); db.execute('CREATE TABLE IF NOT EXISTS upgrade_test_marker(value TEXT NOT NULL)'); db.execute('DELETE FROM upgrade_test_marker'); db.execute('INSERT INTO upgrade_test_marker(value) VALUES(?)',(os.environ['SICOVEN_UPGRADE_MARKER'],)); db.commit(); db.close()"
          if ($LASTEXITCODE -ne 0) { throw 'No se pudo insertar el marcador en la base real utilizada por SICOVEN v1.0.17.' }

          $newInstaller = Get-ChildItem -Path release -Filter 'SICOVEN-Setup-*-x64.exe' -File | Select-Object -First 1
          if (-not $newInstaller) { throw 'No se encontró el instalador nuevo para probar la actualización.' }
          $newInstall = Start-Process -FilePath $newInstaller.FullName -ArgumentList @('/S', "/D=$installDir") -PassThru
          if (-not $newInstall.WaitForExit(180000)) { throw 'La actualización de SICOVEN excedió el tiempo permitido.' }
          $newInstall.Refresh()
          if ($newInstall.ExitCode -ne 0) { throw "El instalador nuevo terminó con código $($newInstall.ExitCode)." }

          python -c "import os,sqlite3; db=sqlite3.connect('file:'+os.environ['SICOVEN_UPGRADE_DB']+'?mode=ro',uri=True); marker=db.execute('SELECT value FROM upgrade_test_marker LIMIT 1').fetchone()[0]; integrity=db.execute('PRAGMA integrity_check').fetchone()[0]; db.close(); assert marker==os.environ['SICOVEN_UPGRADE_MARKER'], 'El marcador de usuario no se conservó.'; assert integrity=='ok', 'SQLite integrity_check: '+integrity; print('Marcador SQLite preservado; integrity_check:',integrity)"
          if ($LASTEXITCODE -ne 0) { throw 'La actualización no conservó íntegramente la base SQLite real de SICOVEN.' }

          $updatedApp = Start-Process -FilePath $app -ArgumentList @('--disable-gpu') -PassThru
          Start-Sleep -Seconds 12
          $updatedApp.Refresh()
          if ($updatedApp.HasExited) { throw "SICOVEN actualizado no arrancó. Código: $($updatedApp.ExitCode)" }
          $null = $updatedApp.CloseMainWindow()
          if (-not $updatedApp.WaitForExit(15000)) { & taskkill.exe /PID $updatedApp.Id /T /F | Out-Null }
          Write-Host "Actualización desde v1.0.17 verificada sobre $($database.FullName): marcador preservado e integridad correcta."

      - name: Publish installer and updater metadata to the existing download release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish_release == true)
        env:
          GH_TOKEN: ${{ secrets.SICOVEN_RELEASE_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -Path release -File | Where-Object {
            $_.Name -match '\.exe$|^latest\.yml$|\.blockmap$'
          })
          $installerFiles = @($files | Where-Object { $_.Name -match '\.exe$' })
          $metadataFiles = @($files | Where-Object { $_.Name -eq 'latest.yml' })
          if ($installerFiles.Count -lt 1) {
            throw 'No hay instalador .exe para publicar.'
          }
          if ($metadataFiles.Count -ne 1) {
            throw 'Debe existir exactamente un latest.yml para publicar.'
          }
          if ($env:GITHUB_REF -eq 'refs/heads/main') {
            $version = node -p "require('./package.json').version"
            $tag = "v$version"
          } else {
            $tag = $env:REF_NAME
          }
          $releaseRepo = 'fenixlife1978/sicoven-descargas'
          gh release view $tag --repo $releaseRepo *> $null
          if ($LASTEXITCODE -ne 0) {
            $releaseTitle = $tag.TrimStart('v')
            gh release create $tag --draft --title $releaseTitle --notes "SICOVEN $releaseTitle para Windows. Incluye ayuda contextual y preguntas frecuentes por módulo." --target main --repo $releaseRepo
            if ($LASTEXITCODE -ne 0) {
              throw "No se pudo crear la Release borrador $tag en sicoven-descargas."
            }
            Write-Host "Se creó la Release borrador $tag; se publicará después de verificar sus archivos."
          }
          $assetPaths = @($files | ForEach-Object { $_.FullName })
          gh release upload $tag @assetPaths --clobber --repo $releaseRepo
          if ($LASTEXITCODE -ne 0) {
            throw 'GitHub no pudo cargar todos los archivos de actualización.'
          }
          $assetNames = gh release view $tag --repo $releaseRepo --json assets --jq '.assets[].name'
          if ($LASTEXITCODE -ne 0) {
            throw 'No se pudo verificar la lista final de archivos de la Release.'
          }
          if (-not ($assetNames -contains 'latest.yml')) {
            throw 'La Release no contiene latest.yml después de la carga.'
          }
          if (-not ($assetNames | Where-Object { $_ -match '\.exe$' })) {
            throw 'La Release no contiene el instalador .exe después de la carga.'
          }
          gh release edit $tag --draft=false --repo $releaseRepo

          if ($LASTEXITCODE -ne 0) {
            throw "Los archivos se cargaron, pero no se pudo publicar la Release $tag."
          }
          $releaseState = gh release view $tag --repo $releaseRepo --json isDraft --jq '.isDraft'
          if ($LASTEXITCODE -ne 0 -or $releaseState -ne 'false') {
            throw "No se pudo confirmar que la Release $tag quedó publicada."
          }
          Write-Host "Release $tag publicada y verificada con instalador y latest.yml."

      - name: Upload complete edition installer artifact
        if: (startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && github.event_name == 'push') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: SICOVEN-COMPLETO-Windows-x64
          path: release/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Generate installer checksums
        if: startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && github.event_name == 'push') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || github.event_name == 'pull_request'
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -Path release -Filter '*.exe' -File)
          if ($files.Count -eq 0) {
            throw 'No hay instaladores para generar checksums.'
          }
          $lines = @('SHA256  Archivo')
          foreach ($file in $files) {
            $hash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            $lines += ('{0}  {1}' -f $hash, $file.Name)
          }
          $outputPath = Join-Path $env:GITHUB_WORKSPACE 'checksums-sha256.txt'
          [IO.File]::WriteAllLines($outputPath, [string[]]$lines, [Text.UTF8Encoding]::new($false))
          if (-not (Test-Path $outputPath -PathType Leaf)) {
            throw 'No se pudo crear el archivo de checksums.'
          }

      - name: Upload installer checksums
        if: (startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && github.event_name == 'push') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: SICOVEN-SHA256-checksums
          path: checksums-sha256.txt
          if-no-files-found: error
          retention-days: 30