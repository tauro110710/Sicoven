name: SICOVEN Windows Release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sicoven-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Restore Windows application icon
        shell: pwsh
        run: |
          $iconPath = Join-Path $env:GITHUB_WORKSPACE 'build/sicoven.ico'
          if (Test-Path 'build/sicoven.ico.base64') {
            $iconBase64 = (Get-Content -Raw 'build/sicoven.ico.base64').Trim()
            if ($iconBase64.Length -gt 100 -and $iconBase64 -ne 'BASE64_PLACEHOLDER') {
              [IO.File]::WriteAllBytes($iconPath, [Convert]::FromBase64String($iconBase64))
            }
          }
          if (-not (Test-Path $iconPath) -or (Get-Item $iconPath).Length -lt 100) {
            throw 'El icono de SICOVEN no se generó correctamente.'
          }
          Copy-Item $iconPath (Join-Path $env:GITHUB_WORKSPACE 'build/icon.ico') -Force

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Test authentication and session security guards
        run: node scripts/test-auth-hardening.cjs

      - name: Test accounting and credit settlement calculations
        run: npm test

      - name: Type-check the application
        run: npm run check:types

      - name: Audit local resources before production build
        run: npm run audit:assets -- --source-only

      - name: Build full edition without sample data
        run: npm run build

      - name: Audit production assets and verify no mock data leaks
        run: npm run audit:assets

      - name: Verify full bundle excludes demo sample records
        shell: pwsh
        run: |
          $bundles = Get-ChildItem -Path dist/assets -Filter '*.js' -File
          if (-not $bundles) {
            throw 'No se generaron bundles JavaScript para SICOVEN completo.'
          }
          if (Select-String -Path $bundles.FullName -SimpleMatch -Pattern 'administracion@losandesdist.com.ve' -Quiet) {
            throw 'El bundle completo contiene datos de ejemplo; no se publicará este instalador.'
          }

      - name: Package installer for PR validation without publishing
        if: github.event_name == 'pull_request'
        run: npx electron-builder --win nsis --publish never

      - name: Package updater metadata and installer locally
        if: startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && github.event_name == 'push') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
        run: npx electron-builder --win nsis --publish never

      - name: Verify installer and updater metadata
        if: startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && github.event_name == 'push') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || github.event_name == 'pull_request'
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path release -Filter 'SICOVEN-Setup-*-x64.exe' -File | Select-Object -First 1
          if (-not $installer) {
            throw 'No se generó el instalador completo .exe de SICOVEN.'
          }
          if (github.event_name -ne 'pull_request') {
            $metadata = Join-Path $env:GITHUB_WORKSPACE 'release/latest.yml'
            if (-not (Test-Path $metadata -PathType Leaf)) {
              throw 'No se generó latest.yml; se cancela la publicación para evitar una actualización incompleta.'
            }
            $metadataText = Get-Content -Raw $metadata
            if ($metadataText -notmatch '(?m)^version:\s*1\.0\.15\s*$') {
              throw 'latest.yml no corresponde a la versión 1.0.15 esperada.'
            }
            if ($metadataText -notmatch '(?m)^sha512:\s*\S+') {
              throw 'latest.yml no contiene el SHA-512 del instalador.'
            }
          }
          Get-FileHash $installer.FullName -Algorithm SHA256 | Format-List

      - name: Install and launch smoke test
        if: startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && github.event_name == 'push') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || github.event_name == 'pull_request'
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path release -Filter 'SICOVEN-Setup-*-x64.exe' -File | Select-Object -First 1
          if (-not $installer) {
            throw 'No se encontró el instalador completo para la prueba de instalación.'
          }
          $installDir = Join-Path $env:RUNNER_TEMP 'SICOVEN-Release-Smoke'
          if (Test-Path $installDir) {
            Remove-Item -Path $installDir -Recurse -Force
          }
          $install = Start-Process -FilePath $installer.FullName -ArgumentList @('/S', "/D=$installDir") -PassThru
          if (-not $install.WaitForExit(120000)) {
            $autoApplication = Get-Process -Name 'SICOVEN' -ErrorAction SilentlyContinue
            if ($autoApplication) {
              & taskkill.exe /IM SICOVEN.exe /T /F | Out-Null
            }
            if (-not $install.WaitForExit(30000)) {
              throw 'El instalador NSIS no terminó dentro del tiempo permitido.'
            }
          }
          $install.Refresh()
          if ($install.ExitCode -ne 0) {
            throw "El instalador NSIS terminó con código $($install.ExitCode)."
          }
          $app = Join-Path $installDir 'SICOVEN.exe'
          $asar = Join-Path $installDir 'resources\app.asar'
          $sqliteNative = Join-Path $installDir 'resources\app.asar.unpacked\node_modules\better-sqlite3\build\Release\better_sqlite3.node'
          foreach ($required in @($app, $asar, $sqliteNative)) {
            if (-not (Test-Path $required -PathType Leaf)) {
              throw "Falta un archivo esencial después de instalar: $required"
            }
          }
          $autoApplication = Get-Process -Name 'SICOVEN' -ErrorAction SilentlyContinue
          if ($autoApplication) {
            & taskkill.exe /IM SICOVEN.exe /T /F | Out-Null
            Start-Sleep -Seconds 2
          }
          $application = Start-Process -FilePath $app -ArgumentList @('--disable-gpu') -PassThru
          Start-Sleep -Seconds 12
          $application.Refresh()
          if ($application.HasExited) {
            throw "SICOVEN se cerró durante el arranque de prueba. Código: $($application.ExitCode)"
          }
          $database = Get-ChildItem -Path $env:APPDATA -Filter 'sicoven.sqlite' -Recurse -File -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $database) {
            throw 'SICOVEN no creó su base de datos SQLite local durante el primer arranque.'
          }
          & taskkill.exe /PID $application.Id /T /F | Out-Null
          Write-Host 'Instalación, app.asar, módulo SQLite nativo, creación de sicoven.sqlite y arranque verificados.'
          Get-Item $installer.FullName | Select-Object Name, Length

      - name: Publish installer and updater metadata to the existing download release
        if: startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && github.event_name == 'push') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
        env:
          GH_TOKEN: ${{ secrets.SICOVEN_RELEASE_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -Path release -File | Where-Object {
            $_.Name -match '\.exe$|^latest\.yml$|\.blockmap$'
          })
          $installerFiles = @($files | Where-Object { $_.Name -match '\.exe$' })
          $metadataFiles = @($files | Where-Object { $_.Name -eq 'latest.yml' })
          if ($installerFiles.Count -lt 1) {
            throw 'No hay instalador .exe para publicar.'
          }
          if ($metadataFiles.Count -ne 1) {
            throw 'Debe existir exactamente un latest.yml para publicar.'
          }
          $tag = if ($env:GITHUB_REF -eq 'refs/heads/main') {
            "v$(node -p "require('./package.json').version")"
          } else {
            $env:REF_NAME
          }
          gh release view $tag --repo fenixlife1978/sicoven-descargas
          if ($LASTEXITCODE -ne 0) {
            throw "La Release $tag no existe en sicoven-descargas. No se creará una etiqueta cruzada automáticamente."
          }
          $assetPaths = @($files | ForEach-Object { $_.FullName })
          gh release upload $tag @assetPaths --clobber --repo fenixlife1978/sicoven-descargas
          if ($LASTEXITCODE -ne 0) {
            throw 'GitHub no pudo cargar todos los archivos de actualización.'
          }
          $assetNames = gh release view $tag --repo fenixlife1978/sicoven-descargas --json assets --jq '.assets[].name'
          if ($LASTEXITCODE -ne 0) {
            throw 'No se pudo verificar la lista final de archivos de la Release.'
          }
          if (-not ($assetNames -contains 'latest.yml')) {
            throw 'La Release no contiene latest.yml después de la carga.'
          }
          if (-not ($assetNames | Where-Object { $_ -match '\.exe$' })) {
            throw 'La Release no contiene el instalador .exe después de la carga.'
          }
          Write-Host "Release $tag verificada con instalador y latest.yml."

      - name: Upload complete edition installer artifact
        if: startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && github.event_name == 'push') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: SICOVEN-COMPLETO-Windows-x64
          path: release/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Generate installer checksums
        if: startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && github.event_name == 'push') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || github.event_name == 'pull_request'
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -Path release -Filter '*.exe' -File)
          if (-not $files) {
            throw 'No hay instaladores para generar checksums.'
          }
          'SHA256  Archivo' | Out-File -FilePath checksums-sha256.txt -Encoding utf8
          foreach ($file in $files) {
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($file.Name)" | Out-File -FilePath checksums-sha256.txt -Append -Encoding utf8

      - name: Upload installer checksums
        if: startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && github.event_name == 'push') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: SICOVEN-SHA256-checksums
          path: checksums-sha256.txt
          if-no-files-found: error
          retention-days: 30
