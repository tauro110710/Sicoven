name: SICOVEN G13 restore validation

on:
  pull_request:
    paths:
      - 'electron/backup-restore.cjs'
      - 'electron/backup-restore.test.cjs'
      - 'electron/company-session-context.cjs'
      - 'electron/company-session-context.test.cjs'
      - 'electron/restore-*.cjs'
      - '.github/workflows/g13-restore.yml'
      - 'package.json'
      - 'package-lock.json'
  push:
    branches:
      - 'certificacion/**'
    paths:
      - 'electron/backup-restore.cjs'
      - 'electron/backup-restore.test.cjs'
      - 'electron/company-session-context.cjs'
      - 'electron/company-session-context.test.cjs'
      - 'electron/restore-*.cjs'
      - '.github/workflows/g13-restore.yml'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

# Keep only the newest validation for a PR/ref when rapid updates arrive.
concurrency:
  group: sicoven-g13-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  restore-tests:
    name: Restore tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm install --no-audit --no-fund
      - name: Run G13 restore and recovery tests
        run: npx tsx --test electron/backup-restore.test.cjs electron/company-session-context.test.cjs electron/restore-engine.test.cjs electron/restore-journal.test.cjs electron/restore-audit-ledger.test.cjs
