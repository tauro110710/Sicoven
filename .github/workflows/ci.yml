name: SICOVEN CI

on:
  pull_request:
    branches: [main, 'feat/historical-accounting-reconstruction']
  push:
    branches: [main, 'ci/windows-installer-validation', 'feat/historical-accounting-reconstruction', 'fix/**']

permissions:
  contents: read

concurrency:
  group: sicoven-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies (skip unused Electron binary on Linux)
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
        run: npm install --no-audit --no-fund
      - name: Run automated tests
        run: npm test
      - name: TypeScript validation
        run: npm run check:types
      - name: Production build
        run: npm run build
