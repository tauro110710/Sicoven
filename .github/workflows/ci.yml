name: SICOVEN CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'ci/windows-installer-validation']

permissions:
  contents: read

concurrency:
  group: sicoven-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies (skip unused Electron binary on Linux)
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
        run: npm install --no-audit --no-fund
      - name: Run automated tests and save evidence
        run: |
          mkdir -p verification-evidence
          set -o pipefail
          npm test 2>&1 | tee verification-evidence/tests.log
      - name: TypeScript validation and record result
        run: |
          npm run check:types 2>&1 | tee verification-evidence/typescript.log
          echo "TypeScript: PASS" >> verification-evidence/summary.md
      - name: Production build and record result
        run: |
          npm run build 2>&1 | tee verification-evidence/build.log
          echo "Production build: PASS" >> verification-evidence/summary.md
      - name: Generate verification report and SHA-256 manifest
        if: always()
        run: |
          {
            echo "# SICOVEN CI verification evidence"
            echo
            echo "- Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- Branch: ${GITHUB_REF_NAME}"
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Timestamp (UTC): $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo "## Validation status"
            echo "- Tests: ${{ steps.test.outcome || 'see job status' }}"
            echo "- TypeScript: see job status/log"
            echo "- Build: see job status/log"
            echo
            echo "## SHA-256 manifest for tracked files"
            git ls-files -z | xargs -0 sha256sum
          } > verification-evidence/report.md
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SICOVEN-verification-${{ github.sha }}
          path: verification-evidence/
          if-no-files-found: warn
          retention-days: 30
