name: SICOVEN CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'ci/windows-installer-validation']

permissions:
  contents: read

concurrency:
  group: sicoven-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies (skip unused Electron binary on Linux)
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
        run: npm install --no-audit --no-fund
      - name: Run automated tests
        run: npm test
      - name: TypeScript validation
        run: npm run check:types
      - name: Production build
        run: npm run build

  windows-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Production build
        run: npm run build
      - name: Build Windows NSIS installer without publishing
        run: npm run dist
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: SICOVEN-Windows-Installer
          path: release/*.exe
          if-no-files-found: error
