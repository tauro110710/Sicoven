name: SICOVEN Windows Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run automated tests
        run: npm test

      - name: Validate TypeScript
        run: npm run check:types

      - name: Build application
        run: npm run build

      - name: Build and publish Windows x64 installer
        env:
          GH_TOKEN: ${{ secrets.SICOVEN_RELEASE_TOKEN }}
        run: npx electron-builder --win nsis --x64 --publish always

      - name: Preserve installer outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sicoven-windows-release-${{ github.ref_name }}
          path: release/*
          if-no-files-found: warn
          retention-days: 14
