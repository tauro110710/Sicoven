name: SICOVEN Windows installer

# Expensive Windows packaging and upgrade smoke test: run only on demand.
# Linux CI remains automatic for pull requests; this workflow is reserved for
# deliberate installer/release builds to protect the GitHub Free allowance.
on:
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: sicoven-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Download previous 1.0.6 installer when available
        id: previous-installer-download
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: SICOVEN-Windows-34a826a9efb02194da61a0dbe0ce53fd50bd73d2
          path: ${{ runner.temp }}/SICOVEN-Previous
          run-id: 41106140337
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Detect legacy installer availability
        id: previous-installer
        shell: pwsh
        run: |
          $legacy = Get-ChildItem -Path (Join-Path $env:RUNNER_TEMP "SICOVEN-Previous") -Filter "SICOVEN-Setup-*-x64.exe" -File -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($legacy) {
            "available=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            Write-Host "Se encontró el instalador 1.0.6; se ejecutará la prueba real de actualización."
          } else {
            "available=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            Write-Warning "El artefacto histórico 1.0.6 no existe en esta copia del repositorio. Se omite únicamente la prueba de actualización; continúan las pruebas y la compilación del instalador actual."
          }
      - name: Set up Python for SQLite upgrade verification
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Test authentication and session security guards
        run: node scripts/test-auth-hardening.cjs
      - name: Run automated tests
        run: npm test
      - name: Check TypeScript types
        run: npm run check:types
      - name: Build renderer
        run: npm run build
      - name: Audit production assets
        run: npm run audit:assets
      - name: Build Windows NSIS installer
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Verify installer exists
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path release -Filter "SICOVEN-Setup-*-x64.exe" -File
          if (-not $installer) {
            throw "No se generó el instalador Windows x64 de SICOVEN."
          }
          $installer | Select-Object Name, Length, LastWriteTime | Format-Table
      - name: Upgrade 1.0.6 to current version and preserve SQLite data
        if: steps.previous-installer.outputs.available == 'true'
        shell: pwsh
        run: |
          $previousInstaller = Get-ChildItem -Path (Join-Path $env:RUNNER_TEMP "SICOVEN-Previous") -Filter "SICOVEN-Setup-*-x64.exe" -File | Select-Object -First 1
          if (-not $previousInstaller) { throw "No se descargó el instalador anterior 1.0.6." }
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $installer = Get-ChildItem -Path release -Filter "SICOVEN-Setup-$version-x64.exe" -File | Select-Object -First 1
          if (-not $installer) { throw "No se generó el instalador $version." }
          $installDir = Join-Path $env:RUNNER_TEMP "SICOVEN-Smoke"
          if (Test-Path $installDir) { Remove-Item -Path $installDir -Recurse -Force }
          $oldInstall = Start-Process -FilePath $previousInstaller.FullName -ArgumentList @("/S", "/D=$installDir") -PassThru
          if (-not $oldInstall.WaitForExit(120000)) { throw "La instalación de SICOVEN 1.0.6 excedió el tiempo permitido." }
          $oldInstall.Refresh()
          if ($oldInstall.ExitCode -ne 0) { throw "La instalación 1.0.6 terminó con código $($oldInstall.ExitCode)." }
          $app = Join-Path $installDir "SICOVEN.exe"
          $asar = Join-Path $installDir "resources\app.asar"
          $sqliteNative = Join-Path $installDir "resources\app.asar.unpacked\node_modules\better-sqlite3\build\Release\better_sqlite3.node"
          foreach ($required in @($app, $asar, $sqliteNative)) {
            if (-not (Test-Path $required -PathType Leaf)) { throw "Falta un archivo esencial de SICOVEN 1.0.6: $required" }
          }
          & (Join-Path $env:GITHUB_WORKSPACE "scripts/windows-renderer-smoke.ps1") -ExecutablePath $app -Version "1.0.6"
          if ($LASTEXITCODE -ne 0) { throw "La interfaz gráfica de SICOVEN 1.0.6 no superó la prueba de renderizado." }
          $database = Get-ChildItem -Path $env:APPDATA -Filter "sicoven.sqlite" -Recurse -File -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $database) { throw "SICOVEN 1.0.6 no creó la base SQLite en userData." }
          $env:SICOVEN_DB_PATH = $database.FullName
          python -c "import os,sqlite3; c=sqlite3.connect(os.environ['SICOVEN_DB_PATH']); c.execute('CREATE TABLE IF NOT EXISTS _sicoven_upgrade_probe (probe_key TEXT PRIMARY KEY, probe_value TEXT NOT NULL)'); c.execute('INSERT OR REPLACE INTO _sicoven_upgrade_probe VALUES (?,?)', ('upgrade','preserve-me')); c.commit(); c.close()"
          if ($LASTEXITCODE -ne 0) { throw "No se pudo preparar el marcador SQLite en 1.0.6." }
          $upgrade = Start-Process -FilePath $installer.FullName -ArgumentList @("/S", "/D=$installDir") -PassThru
          if (-not $upgrade.WaitForExit(120000)) { throw "La actualización 1.0.6 a $version no terminó dentro del tiempo permitido." }
          $upgrade.Refresh()
          if ($upgrade.ExitCode -ne 0) { throw "La actualización a $version terminó con código $($upgrade.ExitCode)." }
          python -c "import os,sqlite3,sys; c=sqlite3.connect(os.environ['SICOVEN_DB_PATH']); r=c.execute('SELECT probe_value FROM _sicoven_upgrade_probe WHERE probe_key=?', ('upgrade',)).fetchone(); c.close(); sys.exit(0 if r and r[0]=='preserve-me' else 1)"
          if ($LASTEXITCODE -ne 0) { throw "La actualización 1.0.6 a $version eliminó o alteró datos SQLite." }
          # Inspeccionar el DOM real del renderer después de actualizar a la versión $version.
          & (Join-Path $env:GITHUB_WORKSPACE "scripts/windows-renderer-smoke.ps1") -ExecutablePath $app -Version $version
          if ($LASTEXITCODE -ne 0) { throw "La interfaz gráfica de SICOVEN $version no superó la prueba de renderizado." }
          python -c "import os,sqlite3,sys; c=sqlite3.connect(os.environ['SICOVEN_DB_PATH']); r=c.execute('SELECT probe_value FROM _sicoven_upgrade_probe WHERE probe_key=?', ('upgrade',)).fetchone(); c.close(); sys.exit(0 if r and r[0]=='preserve-me' else 1)"
          if ($LASTEXITCODE -ne 0) { throw "El arranque real de SICOVEN $version no conservó los datos SQLite del equipo." }
          Write-Host "SICOVEN 1.0.6 -> ${version}: instalación, arranque, actualización, relanzamiento y persistencia SQLite verificados."
          Get-Item $installer.FullName | Select-Object Name, Length
      - name: Publish installer as a GitHub Release asset
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
          UPGRADE_TESTED: ${{ steps.previous-installer.outputs.available }}
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path release -Filter "SICOVEN-Setup-*-x64.exe" -File | Select-Object -First 1
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if (-not $installer) { throw "No se encontró el instalador para publicar." }
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $shortSha = $env:GITHUB_SHA.Substring(0, 7)
          $tag = "sicoven-$version-build-$($env:RUN_NUMBER)-$shortSha"
          $assets = @($installer.FullName)
          $assets += @(Get-ChildItem -Path release -Filter "*.blockmap" -File | ForEach-Object FullName)
          $latest = Join-Path (Get-Location) "release/latest.yml"
          if (Test-Path $latest) { $assets += $latest }
          $notes = "Instalador Windows x64 generado por GitHub Actions. Pasaron las pruebas automatizadas, verificación de tipos, compilación del renderer, auditoría de recursos y generación del instalador."
          if ($env:UPGRADE_TESTED -eq "true") {
            $notes += " También se verificaron instalación desde 1.0.6, actualización, arranque y persistencia SQLite."
          } else {
            $notes += " La prueba de actualización desde 1.0.6 se omitió porque el artefacto histórico no está disponible en esta copia del repositorio."
          }
          gh release create $tag $assets --target $env:GITHUB_SHA --title "SICOVEN $version — Windows x64 ($shortSha)" --notes $notes --prerelease
          if ($LASTEXITCODE -ne 0) { throw "GitHub no pudo publicar el instalador como Release." }
          $releaseUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/tag/$tag"
          $installerUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$tag/$($installer.Name)"
          "## Instalador SICOVEN listo" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "[Descargar $($installer.Name)]($installerUrl)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "[Ver Release y archivos]($releaseUrl)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
      - name: Upload Windows installer artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: SICOVEN-Windows-${{ github.sha }}
          path: |
            release/SICOVEN-Setup-*-x64.exe
            release/*.blockmap
            release/latest.yml
          if-no-files-found: error
          retention-days: 30
