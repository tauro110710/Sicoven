name: SICOVEN Windows installer

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: sicoven-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Download previous 1.0.7 installer for real upgrade test
        uses: actions/download-artifact@v4
        with:
          name: SICOVEN-Windows-3b957b0b717e92ad99a380578e8cf25cdf2baf81
          path: ${{ runner.temp }}/SICOVEN-Previous
          run-id: 41327119811
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Python for SQLite upgrade verification
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Test authentication and session security guards
        run: node scripts/test-auth-hardening.cjs
      - name: Run automated tests
        run: npm test
      - name: Check TypeScript types
        run: npm run check:types
      - name: Build renderer
        run: npm run build
      - name: Audit production assets
        run: npm run audit:assets
      - name: Build Windows NSIS installer
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Verify installer exists
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path release -Filter "SICOVEN-Setup-*-x64.exe" -File
          if (-not $installer) {
            throw "No se generó el instalador Windows x64 de SICOVEN."
          }
          $installer | Select-Object Name, Length, LastWriteTime | Format-Table
      - name: Upgrade 1.0.7 to 1.0.8 and preserve SQLite data
        shell: pwsh
        run: |
          $previousInstaller = Get-ChildItem -Path (Join-Path $env:RUNNER_TEMP "SICOVEN-Previous") -Filter "SICOVEN-Setup-*-x64.exe" -File | Select-Object -First 1
          if (-not $previousInstaller) { throw "No se descargó el instalador anterior 1.0.7." }
          $installer = Get-ChildItem -Path release -Filter "SICOVEN-Setup-1.0.8-x64.exe" -File | Select-Object -First 1
          if (-not $installer) { throw "No se generó el instalador 1.0.8." }
          $installDir = Join-Path $env:RUNNER_TEMP "SICOVEN-Smoke"
          if (Test-Path $installDir) { Remove-Item -Path $installDir -Recurse -Force }
          $oldInstall = Start-Process -FilePath $previousInstaller.FullName -ArgumentList @("/S", "/D=$installDir") -PassThru
          if (-not $oldInstall.WaitForExit(120000)) { throw "La instalación de SICOVEN 1.0.7 excedió el tiempo permitido." }
          $oldInstall.Refresh()
          if ($oldInstall.ExitCode -ne 0) { throw "La instalación 1.0.7 terminó con código $($oldInstall.ExitCode)." }
          $app = Join-Path $installDir "SICOVEN.exe"
          $asar = Join-Path $installDir "resources\app.asar"
          $sqliteNative = Join-Path $installDir "resources\app.asar.unpacked\node_modules\better-sqlite3\build\Release\better_sqlite3.node"
          foreach ($required in @($app, $asar, $sqliteNative)) {
            if (-not (Test-Path $required -PathType Leaf)) { throw "Falta un archivo esencial de SICOVEN 1.0.7: $required" }
          }
          $application = Start-Process -FilePath $app -ArgumentList @("--disable-gpu") -PassThru
          Start-Sleep -Seconds 12
          $application.Refresh()
          if ($application.HasExited) { throw "SICOVEN 1.0.8 se cerró durante el arranque. Código: $($application.ExitCode)" }
          & taskkill.exe /PID $application.Id /T /F | Out-Null
          $database = Get-ChildItem -Path $env:APPDATA -Filter "sicoven.sqlite" -Recurse -File -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $database) { throw "SICOVEN 1.0.7 no creó la base SQLite en userData." }
          $env:SICOVEN_DB_PATH = $database.FullName
          python scripts/verify-sqlite-upgrade.py seed
          if ($LASTEXITCODE -ne 0) { throw "No se pudo preparar el marcador SQLite en 1.0.7." }
          $upgrade = Start-Process -FilePath $installer.FullName -ArgumentList @("/S", "/D=$installDir") -PassThru
          if (-not $upgrade.WaitForExit(120000)) { throw "La actualización 1.0.7 a 1.0.8 no terminó dentro del tiempo permitido." }
          $upgrade.Refresh()
          if ($upgrade.ExitCode -ne 0) { throw "La actualización a 1.0.8 terminó con código $($upgrade.ExitCode)." }
          python scripts/verify-sqlite-upgrade.py verify
          if ($LASTEXITCODE -ne 0) { throw "La actualización 1.0.7 a 1.0.8 eliminó el marcador de prueba o alteró el snapshot contable SQLite." }
          $application = Start-Process -FilePath $app -ArgumentList @("--disable-gpu") -PassThru
          Start-Sleep -Seconds 12
          $application.Refresh()
          if ($application.HasExited) { throw "SICOVEN 1.0.8 se cerró después de la actualización. Código: $($application.ExitCode)" }
          & taskkill.exe /PID $application.Id /T /F | Out-Null
          Write-Host "Actualización real 1.0.7 -> 1.0.8, arranque y conservación del marcador y del snapshot contable SQLite verificados."
          Get-Item $installer.FullName | Select-Object Name, Length
      - name: Clean install 1.0.8 in isolated Windows profile
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path release -Filter "SICOVEN-Setup-1.0.8-x64.exe" -File | Select-Object -First 1
          if (-not $installer) { throw "No se generó el instalador 1.0.8 para la instalación limpia." }
          $cleanInstallDir = Join-Path $env:RUNNER_TEMP "SICOVEN-Clean-Install"
          $cleanAppData = Join-Path $env:RUNNER_TEMP "SICOVEN-Clean-AppData"
          if (Test-Path $cleanInstallDir) { Remove-Item -Path $cleanInstallDir -Recurse -Force }
          if (Test-Path $cleanAppData) { Remove-Item -Path $cleanAppData -Recurse -Force }
          New-Item -ItemType Directory -Path $cleanAppData -Force | Out-Null
          $env:APPDATA = $cleanAppData
          $cleanSetup = Start-Process -FilePath $installer.FullName -ArgumentList @("/S", "/D=$cleanInstallDir") -PassThru
          if (-not $cleanSetup.WaitForExit(120000)) { throw "La instalación limpia 1.0.8 excedió el tiempo permitido." }
          $cleanSetup.Refresh()
          if ($cleanSetup.ExitCode -ne 0) { throw "La instalación limpia 1.0.8 terminó con código $($cleanSetup.ExitCode)." }
          $cleanApp = Join-Path $cleanInstallDir "SICOVEN.exe"
          foreach ($required in @($cleanApp, (Join-Path $cleanInstallDir "resources\app.asar"), (Join-Path $cleanInstallDir "resources\app.asar.unpacked\node_modules\better-sqlite3\build\Release\better_sqlite3.node"))) {
            if (-not (Test-Path $required -PathType Leaf)) { throw "La instalación limpia no contiene un archivo esencial: $required" }
          }
          $cleanProcess = Start-Process -FilePath $cleanApp -ArgumentList @("--disable-gpu", "--user-data-dir=$cleanAppData") -PassThru
          Start-Sleep -Seconds 12
          $cleanProcess.Refresh()
          if ($cleanProcess.HasExited) { throw "SICOVEN 1.0.8 no arrancó en perfil limpio. Código: $($cleanProcess.ExitCode)" }
          & taskkill.exe /PID $cleanProcess.Id /T /F | Out-Null
          $cleanDatabase = Get-ChildItem -Path $cleanAppData -Filter "sicoven.sqlite" -Recurse -File -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $cleanDatabase) { throw "La instalación limpia no creó sicoven.sqlite en el perfil aislado." }
          Write-Host "Instalación limpia 1.0.8, arranque y creación de SQLite verificados en perfil aislado."
          Get-Item $cleanDatabase.FullName | Select-Object FullName, Length, LastWriteTime
      # El instalador se compila y se prueba en el runner, pero no se almacena como artefacto.
      # La cuota de almacenamiento de Actions está agotada; la publicación se hará en la fase web posterior a la certificación.
